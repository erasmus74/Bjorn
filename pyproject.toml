[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mjolnir"
version = "0.1.0"
description = "Autonomous authorized-security-testing platform (v2 of Bjorn)"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "erasmus74" }]
dependencies = [
    "Flask>=3.0,<4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-cov>=4.1,<5.0",
]

[tool.setuptools.packages.find]
include = ["mjolnir*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
# pythonpath=["."] puts the repo root on sys.path so the in-tree `mjolnir`
# package is importable whether or not it is pip-installed. Install mjolnir
# NON-editable on deployment targets (`pip install .`, not `-e`): the
# setuptools editable import-hook finder otherwise conflicts with pytest's
# rootdir handling and resolves `mjolnir` as a namespace package, failing
# with "cannot import name X ... (unknown location)" (seen on the Pi).
pythonpath = ["."]
addopts = "-ra --strict-markers -m 'not hardware and not subprocess'"
markers = [
    "hardware: requires real Pi Zero 2W hardware (deselected by default)",
    "subprocess: forks a child process via multiprocessing; run separately to avoid fork-from-multithreaded deadlock (ADR 0001)",
]

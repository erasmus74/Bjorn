[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mjolnir"
version = "0.1.0"
description = "Autonomous authorized-security-testing platform (v2 of Bjorn)"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "erasmus74" }]
dependencies = [
    "Flask>=3.0,<4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-cov>=4.1,<5.0",
]

[tool.setuptools.packages.find]
include = ["mjolnir*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
# importlib import mode + namespace-package awareness: with an editable
# install (setuptools' import-hook finder) and the package source sitting
# at the rootdir, the legacy "prepend" mode + pythonpath=["."] made pytest
# resolve `mjolnir` as a namespace package and fail to find its members
# ("cannot import name X ... (unknown location)") on some environments
# (seen on the Pi Zero 2W). importlib mode resolves modules via the
# installed package's own loader, which is consistent everywhere.
import-mode = "importlib"
consider_namespace_packages = true
addopts = "-ra --strict-markers -m 'not hardware and not subprocess'"
markers = [
    "hardware: requires real Pi Zero 2W hardware (deselected by default)",
    "subprocess: forks a child process via multiprocessing; run separately to avoid fork-from-multithreaded deadlock (ADR 0001)",
]
